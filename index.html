var TIER_COLORS={'480元档':'#7ec8e3','680元档':'#8ab6ff','980元档':'#a79bff','1380元档':'#c9a1ff','1680元档':'#e0a1ff',
 '全场最低价(旧口径)':'#ffb347','选座最低价(旧口径)':'#ff8c69','最低价':'#ffb347','选座最低价':'#ff8c69'};
var TIER_NAMES={'480元档':'480','680元档':'680','980元档':'980','1380元档':'1380','1680元档':'1680'};
function tierName(t){return TIER_NAMES[t]||(t.indexOf('旧口径')>=0?t.replace('(旧口径)','·旧'):t);}
function tierColor(t){return TIER_COLORS[t]||'#ffd569';}
var state={date:'2026.12.04',plat:'全部',tiers:{}};
var tierOrder=['480元档','680元档','980元档','1380元档','1680元档'];
DATA.forEach(function(s){if(tierOrder.indexOf(s.tier)<0)tierOrder.push(s.tier);});
tierOrder.forEach(function(t){state.tiers[t]=true;});
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderDate(){var h='';[['2026.11.27','11.27 周五'],['2026.11.29','11.29 周日'],['2026.12.04','12.04 周五'],['2026.12.06','12.06 周日']].forEach(function(d){
 h+='<div class="chip'+(state.date===d[0]?' on':'')+'" data-d="'+d[0]+'">'+d[1]+'</div>';});el('segDate').innerHTML=h;}
function renderPlat(){var h='';['全部','票牛','摩天轮'].forEach(function(p){
 h+='<div class="chip'+(state.plat===p?' on':'')+'" data-p="'+p+'">'+p+'</div>';});el('chipsPlat').innerHTML=h;}
function renderTier(){var h='';tierOrder.forEach(function(t){
 h+='<div class="chip'+(state.tiers[t]?' on':'')+'" data-t="'+esc(t)+'"><span class="dot" style="background:'+tierColor(t)+'"></span>'+tierName(t)+'</div>';});el('chipsTier').innerHTML=h;}
function visibleSeries(){return DATA.filter(function(s){
 return s.session===state.date&&(state.plat==='全部'||s.platform===state.plat)&&state.tiers[s.tier];});}
function latest(legs,plat,tier){for(var i=0;i<legs.length;i++){if(legs[i].platform===plat&&legs[i].tier===tier){var p=legs[i].points;return p[p.length-1][1];}}return null;}
function statHtml(legs){
 var tiers=tierOrder.filter(function(t){return state.tiers[t];});
 var lo=null,hi=null,pnlo=null,mv=null;
 tiers.forEach(function(t){var v=latest(legs,'票牛',t);if(v!=null){if(pnlo==null||v<pnlo)pnlo=v;if(lo==null||v<lo)lo=v;if(hi==null||v>hi)hi=v;}
  var m=latest(legs,'摩天轮',t);if(m!=null){if(mv==null||m<mv)mv=m;if(lo==null||m<lo)lo=m;}});
 return '<div class="pill"><div class="lab2">当前筛选最低</div><div class="val">'+(lo!=null?'¥'+lo:'-')+'</div></div>'
 +'<div class="pill"><div class="lab2">票牛最低</div><div class="val">'+(pnlo!=null?'¥'+pnlo:'-')+'</div></div>'
 +'<div class="pill"><div class="lab2">摩天轮最低</div><div class="val">'+(mv!=null?'¥'+mv:'-')+'</div></div>';}
function parseT(s){return new Date(s.replace(' ','T')).getTime();}
function fmtT(ms,sameDay){var d=new Date(ms);function p2(n){return (n<10?'0':'')+n;}
 return sameDay?(p2(d.getHours())+':'+p2(d.getMinutes())):(p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()));}
function niceStep(span,n){var raw=span/n,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),norm=raw/mag;
 var step=norm<1.5?1:norm<3?2:norm<7?5:10;return step*mag;}
var allPts=[];
function draw(){
 var legs=visibleSeries();
 el('stat').innerHTML=statHtml(legs);
 var box=el('chart');
 if(!legs.length){box.innerHTML='<div class="empty">当前筛选条件下暂无数据</div>';allPts=[];return;}
 var series=[];
 legs.forEach(function(l){
  var pts=l.points.slice().sort(function(a,b){return parseT(a[0])-parseT(b[0]);})
   .map(function(p){return {t:parseT(p[0]),v:p[1]};});
  series.push({name:l.platform+' '+tierName(l.tier),plat:l.platform,color:tierColor(l.tier),pts:pts});});
 // x轴改为按"实际出现的时间点"等间距排列：每个数据点之间间距一致, 没有价格的时间不出现
 var tset={};
 series.forEach(function(s){s.pts.forEach(function(p){tset[p.t]=1;});});
 var times=Object.keys(tset).map(Number).sort(function(a,b){return a-b;});
 var nT=times.length;
 var tindex={};times.forEach(function(t,i){tindex[t]=i;});
 var vmin=Infinity,vmax=-Infinity;
 series.forEach(function(s){s.pts.forEach(function(p){if(p.v<vmin)vmin=p.v;if(p.v>vmax)vmax=p.v;});});
 if(vmin===vmax){vmin-=10;vmax+=10;}
 var vpad=Math.max((vmax-vmin)*0.12,10);
 // y轴底边固定从¥2500起(价格跌破2500时自动下探), 网格线每¥500一档
 var ymin=Math.min(Math.max(0,vmin-vpad),2500),ymax=vmax+vpad;
 var W=360,H=400,L=46,R=12,T=14,B=30;
 var pw=W-L-R,ph=H-T-B;
 function X(t){return nT===1?L+pw/2:L+tindex[t]/(nT-1)*pw;}
 function Y(v){return T+ph-(v-ymin)/(ymax-ymin)*ph;}
 var svgParts=[];
 var ystep=500;
 var y0=ymin<=2500?2500:Math.ceil(ymin/ystep)*ystep;
 for(var v=y0;v<=ymax+1e-9;v+=ystep){
  var y=Y(v);
  svgParts.push('<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,232,201,.13)" stroke-width="1"/>');
  svgParts.push('<text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="rgba(255,232,201,.75)">¥'+Math.round(v)+'</text>');}
 var sameDay=new Date(times[0]).toDateString()===new Date(times[nT-1]).toDateString();
 // 时间轴只标注有价格的时间点; 太多时隔行抽稀(最多约6个, 首尾必显示)
 var lblStep=Math.max(1,Math.ceil(nT/6));
 for(var i=0;i<nT;i++){
  if(i%lblStep!==0&&i!==nT-1)continue;
  var t=times[i],an='middle',lx=X(t);
  if(nT>1&&i===0){an='start';lx=L-12;}
  else if(nT>1&&i===nT-1){an='end';lx=W-R+12;}
  svgParts.push('<text x="'+lx+'" y="'+(H-8)+'" text-anchor="'+an+'" font-size="9.5" fill="rgba(255,232,201,.75)">'+fmtT(t,sameDay)+'</text>');}
 allPts=[];
 series.forEach(function(s){
  var ptsStr=s.pts.map(function(p){var x=X(p.t),y=Y(p.v);allPts.push({x:x,y:y,label:s.name,v:p.v,t:p.t});return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  svgParts.push('<polyline points="'+ptsStr+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"'+(s.plat==='摩天轮'?' stroke-dasharray="6 4"':'')+'/>');
  s.pts.forEach(function(p){var x=X(p.t),y=Y(p.v);
   svgParts.push('<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.8" fill="'+s.color+'" stroke="#fff" stroke-width="1"/>');});});
 box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+svgParts.join('')+'</svg>';}
function showTip(ev){
 var tip=el('tip'),box=el('chart');
 if(!allPts.length){tip.style.display='none';return false;}
 var r=box.getBoundingClientRect();
 var cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
 var cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
 var sx=r.width/360,sy=r.height/400;
 var best=null,bd=1e9;
 for(var i=0;i<allPts.length;i++){var p=allPts[i];
  var dx=(p.x-cx/sx),dy=(p.y-cy/sy);var d=dx*dx+dy*dy;
  if(d<bd){bd=d;best=p;}}
 if(!best||bd>2200){tip.style.display='none';return false;}
 tip.innerHTML='<b>'+esc(best.label)+'</b><br>'+fmtT(best.t,false)+'<br>最低价 <b>¥'+best.v+'</b>';
 tip.style.left=(best.x*sx)+'px';
 tip.style.top=(best.y*sy)+'px';
 tip.style.display='block';return true;}
var cbox=el('chart');
// 点到数据点 -> 悬浮持续显示; 点空白处/页面其他位置 -> 消失
cbox.addEventListener('click',function(ev){if(!showTip(ev))el('tip').style.display='none';});
cbox.addEventListener('touchmove',function(ev){showTip(ev);},{passive:true});
document.addEventListener('click',function(ev){if(!cbox.contains(ev.target))el('tip').style.display='none';});
el('segDate').addEventListener('click',function(e){var d=e.target.getAttribute('data-d');if(d){state.date=d;renderDate();draw();}});
el('chipsPlat').addEventListener('click',function(e){var p=e.target.getAttribute('data-p');if(p){state.plat=p;renderPlat();draw();}});

renderDate();renderPlat();renderTier();draw();
